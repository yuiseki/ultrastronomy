[project]
name = "ultrastronomy"
version = "0.1.0"
description = "A harness and skill collection that lets AI agents contribute to astronomy without overclaiming."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2"]

[project.scripts]
ultra = "ultrastronomy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ultrastronomy"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
